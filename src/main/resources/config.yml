lang: ru

# The priority of chat event interception by the plugin. I recommend using HIGH / HIGHEST.
# Available values:
# LOWEST | LOW | NORMAL | HIGH | HIGHEST | MONITOR
chat-event-priority: HIGHEST


#All messages with wrong or without chatSymbol will force to defaultChannel
defaultChannel: Local

Channels:
  Local:
    speak-permission: cloudchat.channel.local
    message-sound: NONE
    cooldown: 0
    cooldown-bypass-permission: cloudchat.cooldown.bypass.local
    prefix: '&8[&7L&8]'
    format: '{channel_prefix} {player_name}: {message}'
    radius: 200
    quickSymbol: ''

  Global:
    speak-permission: cloudchat.channel.global
    message-sound: NONE
    cooldown: 3
    cooldown-bypass-permission: cloudchat.cooldown.bypass.global
    prefix: '&8[&2G&8]'
    format: '{channel_prefix} {player_name}: {message}'
    radius: 0
    quickSymbol: '!'

  Trade:
    speak-permission: cloudchat.channel.trade
    message-sound: ENTITY_EXPERIENCE_ORB_PICKUP
    cooldown: 300
    cooldown-bypass-permission: cloudchat.cooldown.bypass.trade
    prefix: '&8[&a$&8]'
    format: '{channel_prefix} {player_name}: {message}'
    radius: 0
    quickSymbol: '$'